name: Lamina build

on:
  push:
  pull_request:

jobs:
  header-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies for API and tool-call tests
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Validate pinned model header fixture
        run: python -m unittest discover -s tests/lamina -v
      - name: Configure
        run: cmake -S . -B build -DLAMINA_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build --config Release
